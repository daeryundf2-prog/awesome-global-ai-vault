name: Weekly lazyradar Sync & Leaderboard

on:
  schedule:
    # Every Monday at 00:00 UTC (09:00 KST)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-lazyradar-sync
  cancel-in-progress: true

jobs:
  sync-metrics-and-rank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Repository Metrics & Assign Rankings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_metrics.py

      - name: Discover Emerging Trending AI Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/discover_trending.py

      - name: Regenerate README with Dynamic Leaderboard
        run: |
          python scripts/generate_global_readme.py

      - name: Validate data schema before committing
        run: |
          python scripts/validate_data.py

      - name: Build unavailable-repo cleanup report
        run: |
          python scripts/report_unavailable.py --json-out removal_candidates.json --md-out removal_issue.md

      - name: File cleanup issue for persistent 404 repos
        if: hashFiles('removal_candidates.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create radar-cleanup --description "Automated lazyradar cleanup tracking" --color E99695 --force || true
          open_count=$(gh issue list --label radar-cleanup --state open --json number --jq 'length')
          if [ "$open_count" -eq 0 ]; then
            gh issue create --title "lazyradar cleanup: unavailable repositories" --label radar-cleanup --body-file removal_issue.md
          else
            echo "An open radar-cleanup issue already exists — skipping to avoid duplicates."
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(radar): weekly update of global AI metrics and leaderboard [skip ci]"
            git push origin main
          fi
